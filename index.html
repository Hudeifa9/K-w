<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="shortcut icon" href="power.png"  type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Lemon&display=swap');

    </style>
</head>
<body>
    <div class="container" id="container">
        <div  class="row">
            <div class="col-sm-12">
                <h1 class="text-center">K/w <span style="font-weight: 700;">Counter</span> </h1>
                <form class="form-control" >
                    <div class="col-sm-12">
                        <label for="Name" class="label">Full Name</label >
                        <input type="text" class="form-control" id="name" placeholder="Hudeifa Mohamud Ahmed">
                        <p id="nameHelper"></p>
                    </div>
                    <div class="row" id="row1">
                        <div class="col-sm-6">
                            <label for="Name" class="label">Akh/H</label>
                            <input type="text" class="form-control" id="AkhH" placeholder="3333...">
                            <p id="AkhHHelper"></p>
                        </div>
                        <div class="col-sm-6">
                            <label for="Name" class="label">Akh/D</label>
                            <input type="text" class="form-control" id="AkhD" placeholder="4444...">
                            <p id="AkhDHelper"></p>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-sm-6">
                            <button type="reset" class="btn btn-danger w-100 mt-5" id="reset">Reset</button>
                        </div>
                        <div class="col-sm-6">
                            <button type="submit" class="btn btn-primary w-100 mt-5" id="submit">Submit</button>
                        </div>
                    </div>
                </form>

            </div>
        </div>
        <div class="row mt-5">
            <div  class="col-sm-6 rounded " id="shape"> 
                <p  class="text-center mt-5" id="result"></p>
            </div>
        </div>
        
    </div>
    <div class="row">
        <div class="col-sm-12"  id="table">
            <table id="table" class="table mt-5 border table table-hover text-white">
                <thead id="thead">
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Akh/H</th>
                        <th>Akh/D</th>
                        <th>Total</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody class="table table-hover" id="tableBody">
                
                </tbody>
            </table>
        </div>
    </div>
    <script >
        let name1 = document.querySelector('#name');
let AkhH = document.querySelector('#AkhH');
let AkhD = document.querySelector('#AkhD');
let reset = document.querySelector('#reset');
let submit = document.querySelector('#submit');
let result = document.querySelector('#result');
let nameHelper = document.querySelector('#nameHelper');
let AkhHHelper = document.querySelector('#AkhHHelper');
let AkhDHelper = document.querySelector('#AkhDHelper');
let table = document.querySelector('#table tbody');
const rate = 0.41;
let total1 = document.querySelectorAll('total1')




submit.addEventListener('click', function (event) {
    event.preventDefault();

    let isValid = checkEmpty(name1) && checkEmpty1(AkhH) && checkEmpty2(AkhD);

    if (isValid) {
        
        regesterUser(name1, AkhH, AkhD);
        clear();
        
        
    }
});




table.addEventListener('click', removeRow) 
   


function checkEmpty(filled) {
    if (filled.value.trim() === '') {
        filled.classList.add('border', 'border-danger');
        nameHelper.innerHTML = 'Please fill the name field';
        nameHelper.style.color = 'red';
        return false;
    } else {
        filled.classList.remove('border', 'border-danger');
        filled.classList.add('border', 'border-success');
        nameHelper.innerHTML = '';
        return true;
    }
}

function checkEmpty1(filled) {
    if (filled.value.trim() === '') {
        filled.classList.add('border', 'border-danger');
        AkhHHelper.innerHTML = 'Please fill the AkhH field';
        AkhHHelper.style.color = 'red';
        return false;
    } else {
        filled.classList.remove('border', 'border-danger');
        filled.classList.add('border', 'border-success');
        AkhHHelper.innerHTML = '';
        return true;
    }
}

function checkEmpty2(filled) {
    if (filled.value.trim() === '') {
        filled.classList.add('border', 'border-danger');
        AkhDHelper.innerHTML = 'Please fill the AkhD field';
        AkhDHelper.style.color = 'red';
        return false;
    } else {
        filled.classList.remove('border', 'border-danger');
        filled.classList.add('border', 'border-success');
        AkhDHelper.innerHTML = '';
        return true;
    }
}


function regesterUser(name1, AkhH, AkhD) {
    let rowCount = table.rows.length + 1;
    let sub = parseFloat(AkhD.value) - parseFloat(AkhH.value);
    let total = sub * rate;

    let user = `
        <tr>
            <td>${rowCount}</td>
            <td>${name1.value}</td>
            <td>${AkhH.value}</td>
            <td>${AkhD.value}</td>
            <td id="total1">$${total.toFixed(2)}</td>
            <td><button class="btn btn-danger delete-btn" id="btn"> <i class="fa fa-trash"></i> Delete</button></td>
        </tr>
    `;

    table.innerHTML += user;
    result.textContent = `$${total.toFixed(2)}`;
}


reset.addEventListener('click', clear);

function clear() {
    name1.value = '';
    AkhH.value = '';
    AkhD.value = '';
}

function isDigit(inputField) {
    inputField.addEventListener('keypress', function(event) {
        if (!/[0-9]/.test(event.key)) {
            event.preventDefault();
            inputField.classList.add('border', 'border-danger');
            AkhHHelper.innerHTML = 'Just for numbers only';
            AkhHHelper.style.color = 'red';
        } else {
            inputField.classList.remove('border', 'border-danger');
            AkhHHelper.innerHTML = '';
        }
    });
}

function isDigit1(inpu1) {
    inpu1.addEventListener('keypress', function(event) {
        if (!/[0-9]/.test(event.key)) {
            event.preventDefault();
            inpu1.classList.add('border', 'border-danger');
            AkhDHelper.innerHTML = 'Just for numbers only';
            AkhDHelper.style.color = 'red';
        } else {
            inpu1.classList.remove('border', 'border-danger');
            AkhDHelper.innerHTML = '';
        }
    });
}
isDigit(AkhH);
isDigit1(AkhD);



function removeRow(event){
    if(event.target.id === 'btn'){
        event.target.parentElement.parentElement.remove();
    }
}

    </script>
</body>
</html>
